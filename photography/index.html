    <div class="main-content">
        <div class="photo-collage" id="photoCollage"></div>
    </div>

    <div id="imageModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <button class="modal-nav modal-prev" onclick="prevImage()">‹</button>
            <img id="modalImage" src="" alt="">
            <button class="modal-nav modal-next" onclick="nextImage()">›</button>
        </div>
    </div>

    <script src="/config.js"></script>
    <script src="/portfolio.js"></script>
    <script>
        function initPhotography() {
            const photoCollage = document.getElementById('photoCollage');
            photoCollage.innerHTML = portfolioConfig.photography.map((img, index) => `
                <div class="photo-item" onclick='openModal(${JSON.stringify(portfolioConfig.photography)}, ${index})'>
                    <img src="/${img}" alt="Photography ${index + 1}" onerror="this.style.display='none'" loading="lazy">
                </div>
            `).join('');
        }

        initPhotography();
    </script>
